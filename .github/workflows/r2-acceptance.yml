name: R2 acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/r2-acceptance.yml"
      - "apps/eden/**"
      - "packages/**"
      - "scripts/**"
      - "docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/r2-acceptance.yml"
      - "apps/eden/**"
      - "packages/**"
      - "scripts/**"
      - "docs/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read
  packages: read

jobs:
  packaged-acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile
      - name: Restore node-pty helper permissions
        if: runner.os == 'macOS'
        run: chmod +x node_modules/.pnpm/node-pty@1.1.0/node_modules/node-pty/prebuilds/darwin-*/spawn-helper
      - run: pnpm peers check
      - run: pnpm test
      - run: pnpm test:r2-process
      - run: pnpm test:r2-provider-fixtures
      - run: pnpm test:r2-secret-canaries
      - run: pnpm test:r2-safe-actuation
      - run: pnpm test:r2-budgets
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm code:check
      - run: pnpm markdown:check
      - run: pnpm --filter @eden/cli package:bun
      - run: pnpm test:r2-native-archive
      - name: Packaged safe-actuation evidence
        run: node scripts/r2-safe-actuation-acceptance.mjs apps/eden/dist r2-evidence/safe-actuation.json ${{ github.sha }}
      - name: Packaged process evidence
        shell: bash
        run: |
          mkdir -p r2-evidence/production-pty
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            artifact=apps/eden/dist/eden.exe
          else
            artifact=apps/eden/dist/eden
          fi
          node scripts/smoke-standalone.mjs "$artifact" r2-evidence/production-pty/standalone.json
          node scripts/r1-production-pty.mjs "$artifact" r2-evidence/production-pty
      - name: Linux R2 responsive PTY evidence
        if: runner.os == 'Linux'
        run: node scripts/r2-tui-pty.mjs apps/eden/dist/eden r2-evidence/r2-tui.json ${{ github.sha }} --functional-only
      - uses: actions/upload-artifact@v4
        with:
          name: r2-acceptance-${{ runner.os }}-${{ runner.arch }}
          path: |
            apps/eden/dist/eden*
            apps/eden/dist/rg*
            apps/eden/dist/THIRD_PARTY_NOTICES.txt
            r2-evidence/**
          if-no-files-found: error

  ubuntu-docker-repository-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:r2-docker-contracts
      - run: pnpm test:r2-docker-fixture
      - run: pnpm test:r2-docker-recovery
      - run: pnpm test:r2-doctor
      - run: pnpm test:r2-docker-evidence
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm code:check
      - run: pnpm markdown:check
      - run: pnpm --filter @eden/cli package:bun
      - name: Prepare fresh userns-remap daemon and exact image
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          r2_user="$(id -un)"
          r2_root="/tmp/eden-r2-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          r2_context="eden-r2-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if ! grep -q "^${r2_user}:" /etc/subuid; then
            printf '%s:100000:65536\n' "$r2_user" | sudo tee -a /etc/subuid >/dev/null
          fi
          if ! grep -q "^${r2_user}:" /etc/subgid; then
            printf '%s:100000:65536\n' "$r2_user" | sudo tee -a /etc/subgid >/dev/null
          fi
          mkdir -p "$r2_root/data" "$r2_root/exec"
          chmod 0711 "$r2_root" "$r2_root/data" "$r2_root/exec"
          sudo dockerd \
            --data-root "$r2_root/data" \
            --exec-root "$r2_root/exec" \
            --pidfile "$r2_root/docker.pid" \
            --host "unix://$r2_root/docker.sock" \
            --userns-remap "$r2_user" \
            --storage-driver overlay2 \
            --bridge none \
            --iptables=false \
            --ip-forward=false \
            --ip-masq=false \
            --userland-proxy=false \
            >"$r2_root/dockerd.log" 2>&1 &
          printf '%s\n' "$!" > "$r2_root/launcher.pid"
          for attempt in $(seq 1 60); do
            if [ -S "$r2_root/docker.sock" ]; then break; fi
            if ! sudo kill -0 "$(cat "$r2_root/launcher.pid")" 2>/dev/null; then
              cat "$r2_root/dockerd.log"
              exit 1
            fi
            sleep 1
          done
          docker context create "$r2_context" --docker "host=unix://$r2_root/docker.sock"
          for attempt in $(seq 1 60); do
            if docker --context "$r2_context" version >/dev/null 2>&1; then break; fi
            sleep 1
          done
          printf '%s' "$GHCR_TOKEN" | docker --context "$r2_context" login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker --context "$r2_context" pull "ghcr.io/ai-eden/eden-node24-check@sha256:8421694e36135472ce9c40011ca9b8be22f1f2af643493d8fe6cb47954684d4f"
          docker --context "$r2_context" logout ghcr.io
          printf 'R2_DOCKER_ROOT=%s\n' "$r2_root" >> "$GITHUB_ENV"
          printf 'R2_DOCKER_CONTEXT=%s\n' "$r2_context" >> "$GITHUB_ENV"
      - name: Real repository-check runner
        run: >-
          EDEN_REPOSITORY_CHECK_DOCKER_CONTEXT="$R2_DOCKER_CONTEXT"
          node --test packages/coding-runtime/test/repository-check-real.test.ts
      - name: Packaged Docker repository-check evidence
        run: >-
          node scripts/r2-docker-repository-check-acceptance.mjs
          apps/eden/dist
          r2-evidence/docker-repository-check.json
          ${{ github.sha }}
          --docker-context
          "${R2_DOCKER_CONTEXT}"
      - name: Verify evidence contract
        run: >-
          node --input-type=module -e
          "import { readFile } from 'node:fs/promises';
          import { validateDockerRepositoryCheckEvidence } from './scripts/r2-docker-repository-check-evidence.mjs';
          validateDockerRepositoryCheckEvidence(JSON.parse(await readFile('r2-evidence/docker-repository-check.json','utf8')), process.env.GITHUB_SHA);"
      - uses: actions/upload-artifact@v4
        with:
          name: r2-docker-repository-check-Linux-X64
          path: r2-evidence/docker-repository-check.json
          if-no-files-found: error
      - name: Exact daemon cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${R2_DOCKER_CONTEXT:-}" ]; then
            docker --context "$R2_DOCKER_CONTEXT" ps --all --quiet || true
            docker context rm --force "$R2_DOCKER_CONTEXT" || true
          fi
          if [ -n "${R2_DOCKER_ROOT:-}" ] && [ -f "$R2_DOCKER_ROOT/docker.pid" ]; then
            sudo kill "$(cat "$R2_DOCKER_ROOT/docker.pid")" 2>/dev/null || true
            for attempt in $(seq 1 30); do
              if ! sudo kill -0 "$(cat "$R2_DOCKER_ROOT/docker.pid")" 2>/dev/null; then break; fi
              sleep 1
            done
            sudo kill -KILL "$(cat "$R2_DOCKER_ROOT/docker.pid")" 2>/dev/null || true
            sudo rm -rf -- "$R2_DOCKER_ROOT"
          fi
